source_id = "us_fed_press_releases"
name = "Federal Reserve Board — Press Releases"
market = "US"
language = "en"
source_type = "REGULATOR"
authority_level = "PRIMARY"
domains = ["FINANCE", "LAW_POLICY"]
priority = 100
content_scope = "EDITORIAL_NEWS"

[acquisition]
method = "RSS"
endpoint_url = "https://www.federalreserve.gov/feeds/press_all.xml"
poll_interval_minutes = 15

# Rights reviewed 2026-08-18: snippet display approved based on publisher's own
# published policy (see rationale below). Full-text storage, redistribution, and AI
# processing remain separately gated and are NOT approved by this review.
# Basis: Federal Reserve disclaimer (federalreserve.gov/disclaimer.htm): content "is in the public domain and may be copied and distributed without permission"; cite the Board as source. Non-Board-attributed images require separate permission -- hotlink only, do not re-host.
[rights]
can_fetch = true
can_store_metadata = true
can_store_full_text = false
can_ai_process = false
can_show_snippet = true
can_redistribute_full_text = false
rights_review_status = "APPROVED"

[cost]
type = "FREE"
monthly_fixed_usd = 0
