source_id = "eu_ecb_press"
name = "European Central Bank — Press and News"
market = "EU"
language = "en"
source_type = "REGULATOR"
authority_level = "PRIMARY"
domains = ["FINANCE", "LAW_POLICY"]
priority = 100
content_scope = "EDITORIAL_NEWS"

[acquisition]
method = "RSS"
endpoint_url = "https://www.ecb.europa.eu/rss/press.html"
poll_interval_minutes = 15

# Rights reviewed 2026-08-18: snippet display approved based on publisher's own
# published policy (see rationale below). Full-text storage, redistribution, and AI
# processing remain separately gated and are NOT approved by this review.
# Basis: ECB disclaimer (ecb.europa.eu/services/using-our-site/disclaimer): general site information may be reproduced provided "the ECB must be cited as the source." Stricter authorization applies to named-author Working/Occasional Papers (not press releases). No re-framing of ecb.europa.eu.
[rights]
can_fetch = true
can_store_metadata = true
can_store_full_text = false
can_ai_process = false
can_show_snippet = true
can_redistribute_full_text = false
rights_review_status = "APPROVED"

[cost]
type = "FREE"
monthly_fixed_usd = 0
