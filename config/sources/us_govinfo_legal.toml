source_id = "us_govinfo_legal"
name = "GovInfo Public and Private Laws"
market = "US"
language = "en"
source_type = "GOVERNMENT"
authority_level = "PRIMARY"

domains = [
  "LAW_POLICY",
  "ENERGY",
  "TECHNOLOGY",
  "REAL_ESTATE",
  "FINANCE"
]

content_scope = "FORMAL_REGULATORY_LEGAL"
priority = 100

[acquisition]
method = "REST_API"
endpoint_url = "https://api.govinfo.gov/collections/PLAW"
poll_interval_minutes = 15

# Rights reviewed 2026-08-18: snippet display approved based on publisher's own
# published policy (see rationale below). Full-text storage, redistribution, and AI
# processing remain separately gated and are NOT approved by this review.
# Basis: US federal government work; govinfo.gov/about/policies directly cites 17 U.S.C. §105 ("Copyright protection...is not available for any work of the United States Government"). Caveat: some hosted images may be third-party licensed, not public domain -- do not hotlink non-official images.
[rights]
can_fetch = true
can_store_metadata = true
can_store_full_text = false
can_ai_process = false
can_show_snippet = true
can_redistribute_full_text = false
rights_review_status = "APPROVED"

[cost]
type = "FREE"
monthly_fixed_usd = 0
