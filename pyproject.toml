[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence"
version = "0.1.0"
description = "Data Engineer components for the Market & Regulatory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6,<7",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
include = ["*.py", "*.pyi"]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/market_intelligence"]
pretty = true
show_error_codes = true
warn_unused_configs = true
